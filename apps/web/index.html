<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Verdis — gestão da circularidade e impacto socioambiental" />
    <title>Verdis — Gestão da Circularidade</title>
    <meta name="theme-color" content="#536938" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Verdis" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Domine:wght@400;500;600;700&family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />

  </head>
  <body>
    <script>
      ;(() => {
        try {
          const redirect = window.sessionStorage.getItem('verdis.pages.redirect')
          if (redirect) {
            window.sessionStorage.removeItem('verdis.pages.redirect')
            window.history.replaceState({}, '', redirect)
          }
        } catch {
          // Route recovery is best-effort; the application still boots at the root.
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
