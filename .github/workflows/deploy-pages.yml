name: Deploy Verdis Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: verdis-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VERDIS_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VERDIS_SUPABASE_PUBLISHABLE_KEY }}
      VITE_ALLOW_SELF_SIGNUP: ${{ vars.VERDIS_ALLOW_SELF_SIGNUP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production configuration
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "Missing VERDIS_SUPABASE_URL" && exit 1)
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || (echo "Missing VERDIS_SUPABASE_PUBLISHABLE_KEY" && exit 1)

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build production web app
        run: pnpm build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
