name: Deploy Verdis Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verdis-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.VERDIS_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.VERDIS_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.VERDIS_SUPABASE_PROJECT_ID }}
      VERDIS_APP_URL: ${{ vars.VERDIS_APP_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production configuration
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing VERDIS_SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing VERDIS_SUPABASE_DB_PASSWORD" && exit 1)
          test -n "$SUPABASE_PROJECT_ID" || (echo "Missing VERDIS_SUPABASE_PROJECT_ID" && exit 1)
          test -n "$VERDIS_APP_URL" || (echo "Missing VERDIS_APP_URL" && exit 1)

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push database migrations
        run: supabase db push

      - name: Configure Edge Function application URL
        run: supabase secrets set VERDIS_APP_URL="$VERDIS_APP_URL"

      - name: Deploy cooperative invitation function
        run: supabase functions deploy invite-cooperative-user
